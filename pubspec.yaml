name: flutter_weather_app
description: A weather dashboard app showcasing clean architecture, REST API integration, Riverpod state management, and micro-animations.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.4.3

  # Animations
  flutter_animate: ^4.5.0

  # Fonts & UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

  # Data classes
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Location
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
