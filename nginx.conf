server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  # Single-page app: unknown paths fall back to index.html (go_router / Navigator routes)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never cache the bootstrap/service worker so new deploys are picked up
  location ~* (index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
    add_header Cache-Control "no-cache";
  }

  location ~* \.(js|wasm|css|png|jpg|svg|ico|ttf|otf|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
